services:
  neo4j:
    profiles: [graph]
    image: neo4j:5.22.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # Neo4j validates its password when the explicit graph profile starts.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-}"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_memory_heap_initial__size: "1G"
      NEO4J_dbms_memory_heap_max__size: "2G"
      NEO4J_dbms_memory_pagecache_size: "1G"
      NEO4J_apoc_trigger_enabled: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PRIVATE_RETRIEVAL_BACKEND: "${PRIVATE_RETRIEVAL_BACKEND:-hybrid}"
    restart: unless-stopped
    env_file: .env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      FASTAPI_WORKERS: "1"
      APP_DATABASE_URL: "sqlite+aiosqlite:////app/data/app.db"
      ARTIFACT_ROOT: "/app/data/artifacts"
      SKILLS_ROOT: "/app/skills"
      NEO4J_URI: "bolt://neo4j:7687"
      FRONTEND_ORIGINS: "http://127.0.0.1:${FRONTEND_PORT:-5173},http://localhost:${FRONTEND_PORT:-5173}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
      - ./files:/app/files
      - ./cache:/app/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_backups:
